name: build-driver
on: workflow_dispatch
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: compile driver
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          set WDK=C:\Program Files (x86)\Windows Kits\10
          cl /nologo /kernel /GS- /Gs9999999 /W4 /c driver\lxrun.c ^
            /D_AMD64_ /D_WIN64 /D_WIN32_WINNT=0x0A00 ^
            /I"%WDK%\Include\10.0.26100.0\km" ^
            /I"%WDK%\Include\10.0.26100.0\km\crt" ^
            /Fo:lxrun.obj
          if errorlevel 1 exit /b 1
          link /nologo /DRIVER /SUBSYSTEM:NATIVE /ENTRY:DriverEntry /OUT:lxrun.sys ^
            lxrun.obj ^
            "%WDK%\Lib\10.0.26100.0\km\x64\ntoskrnl.lib" ^
            "%WDK%\Lib\10.0.26100.0\km\x64\BufferOverflowK.lib" ^
            /NODEFAULTLIB
          if errorlevel 1 exit /b 1
          dir lxrun.sys

      - name: self-sign
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=LxrunTest" `
            -CertStoreLocation Cert:\CurrentUser\My -HashAlgorithm SHA256
          $pwd = ConvertTo-SecureString -String "test" -Force -AsPlainText
          Export-PfxCertificate -Cert $cert -FilePath cert.pfx -Password $pwd | Out-Null
          Export-Certificate -Cert $cert -FilePath cert.cer | Out-Null
          $sign = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\10.0.19041.0\x64\signtool.exe'
          & $sign.FullName sign /fd sha256 /f cert.pfx /p test /t http://timestamp.digicert.com lxrun.sys
          if ($LASTEXITCODE -ne 0) { Write-Host "sign failed, retry without timestamp"; & $sign.FullName sign /fd sha256 /f cert.pfx /p test lxrun.sys }

      - name: install cert and load driver
        shell: pwsh
        run: |
          Import-Certificate -FilePath cert.cer -CertStoreLocation Cert:\LocalMachine\Root | Out-Null
          Import-Certificate -FilePath cert.cer -CertStoreLocation Cert:\LocalMachine\TrustedPublisher | Out-Null
          Write-Host "--- verify after trust ---"
          $sign2 = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\10.0.19041.0\x64\signtool.exe'
          & $sign2.FullName verify /pa /v lxrun.sys
          Write-Host "--- copy ---"
          Copy-Item lxrun.sys C:\Windows\System32\drivers\lxrun.sys -Force
          Write-Host "--- create ---"
          Write-Host "--- create lxrun ---"
          sc.exe create lxrun type= kernel start= demand binPath= C:\Windows\System32\drivers\lxrun.sys
          Write-Host "--- start ---"
          sc.exe start lxrun
          Start-Sleep -Seconds 2
          Write-Host "--- query ---"
          sc.exe query lxrun
          Write-Host "--- symlink check ---"
          try {
            $fs = [System.IO.File]::Open('\\.\Lxrun', 'Open', 'ReadWrite')
            Write-Host "  device \\.\Lxrun OPENED OK"
            $fs.Close()
          } catch {
            Write-Host "  open failed: $($_.Exception.Message)"
          }
          exit 0

      - name: build and run lxprobe
        shell: cmd
        run: |
          echo f0VMRgIBAQAAAAAAAAAAAAIAPgABAAAAeABAAAAAAABAAAAAAAAAAAAAAAAAAAAAAAAAAEAAOAABAEAAAAAAAAEAAAAFAAAAAAAAAAAAAAAAAEAAAAAAAAAAQAAAAAAAzAAAAAAAAADMAAAAAAAAAAAQAAAAAAAAuAIAAABIjT1BAAAAvgAAAQAPBUmJxEiB7AAQAAC42QAAAESJ50iJ5roABAAADwVJicW4AQAAAL8BAAAASInmRInqDwW4PAAAADH/DwUvbW50L2MA> ls.b64
          echo > st.b64
          echo f0VMRgIBAQAAAAAAAAAAAAIAPgABAAAAeABAAAAAAABAAAAAAAAAAAAAAAAAAAAAAAAAAEAAOAABAEAAAAAAAAEAAAAFAAAAAAAAAAAAAAAAAEAAAAAAAAAAQAAAAAAAnQAAAAAAAACdAAAAAAAAAAAQAAAAAAAAuAEAAAC/AQAAAEiNNRAAAAC6BAAAAA8FuDwAAAAx/w8FaGkhCg==> h.b64
          certutil -decode h.b64 C:\Windows\hello.x64
          certutil -decode st.b64 C:\Windows\ls.x64
          echo  > rd.b64
          certutil -decode rd.b64 C:\Windows\rd.x64
          echo  > mp.b64
          certutil -decode mp.b64 C:\Windows\mp.x64
          echo  > dy.b64
          echo  >> dy.b64
          echo  >> dy.b64
          echo  >> dy.b64
          certutil -decode dy.b64 C:\Windows\dy.x64
          echo  > libm.b64
          if not exist C:\Windows\lxroot mkdir C:\Windows\lxroot
          if not exist C:\Windows\lxroot\lib mkdir C:\Windows\lxroot\lib
          if not exist C:\Windows\lxroot\lib\x86_64-linux-gnu mkdir C:\Windows\lxroot\lib\x86_64-linux-gnu
          certutil -decode libm.b64 C:\Windows\lxroot\lib\x86_64-linux-gnu\libm.so.6
          echo  > libdep.b64
          curl -sL -o C:\Windows\lxroot\lib\x86_64-linux-gnu\libdep.so https://raw.githubusercontent.com/ylh440104/win-kernel-lab/main/testassets/libc.so.6
          curl -sL -o C:\Windows\lxroot\lib\x86_64-linux-gnu\ld-linux-x86-64.so.2 https://raw.githubusercontent.com/ylh440104/win-kernel-lab/main/testassets/ld-linux-x86-64.so.2
          dir C:\Windows\lxroot\lib\x86_64-linux-gnu
          copy C:\Windows\hello.x64 C:\Windows\h
          dir C:\Windows\mp.x64 C:\Windows\h
          dir C:\Windows\dy.x64 C:\Windows\h
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cl /nologo /W3 /Fe:lxprobe.exe driver\lxprobe.c
          if errorlevel 1 exit /b 1
          echo ===== PROBE OUTPUT =====
          lxprobe.exe
          echo ===== END PROBE =====

      - name: dump driver log
        if: always()
        shell: pwsh
        run: |
          Write-Host "--- driver status ---"
          sc.exe query lxrun 2>&1 | Out-String | Write-Host
          exit 0
